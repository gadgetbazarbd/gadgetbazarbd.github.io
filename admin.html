<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gadget Bazar BD • Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">GB</div>
      <div class="eyebrow">Gadget Bazar BD</div>
      <h1>Admin control center</h1>
      <p class="muted">Manage products, orders, customers, delivery and store settings from one place.</p>
      <form id="loginForm" class="stack gap16">
        <label>Username<input id="loginUser" required autocomplete="username" placeholder="admin"></label>
        <label>Password<input id="loginPass" type="password" required autocomplete="current-password" placeholder="admin123"></label>
        <button class="btn primary full" type="submit">Sign in</button>
      </form>
      <div class="demo-note">Demo login: <b>admin</b> / <b>admin123</b></div>
    </div>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo-row"><div class="brand-mark small">GB</div><div><strong>Gadget Bazar BD</strong><span>Admin workspace</span></div></div>
        <button class="icon-btn mobile-only" id="closeSidebar">×</button>
      </div>
      <nav id="navMenu" class="nav-menu">
        <button data-page="dashboard" class="nav-item active"><span>⌂</span> Dashboard</button>
        <button data-page="products" class="nav-item"><span>▣</span> Products</button>
        <button data-page="orders" class="nav-item"><span>◫</span> Orders</button>
        <button data-page="customers" class="nav-item"><span>◉</span> Customers</button>
        <button data-page="reports" class="nav-item"><span>◒</span> Reports</button>
        <div class="nav-label">Store controls</div>
        <button data-page="delivery" class="nav-item"><span>⌁</span> Delivery</button>
        <button data-page="categories" class="nav-item"><span>◈</span> Categories</button>
        <button data-page="payments" class="nav-item"><span>৳</span> Payments</button>
        <button data-page="settings" class="nav-item"><span>⚙</span> Settings</button>
      </nav>
      <div class="sidebar-bottom"><button id="logoutBtn" class="nav-item danger"><span>⇥</span> Logout</button></div>
    </aside>
    <div class="mobile-backdrop" id="mobileBackdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-btn mobile-only" id="openSidebar">☰</button><div><div id="pageEyebrow" class="eyebrow">Overview</div><h2 id="pageTitle">Dashboard</h2></div></div>
        <div class="topbar-actions"><div class="store-pill"><span class="status-dot"></span><span id="storeStatus">Store online</span></div><button class="icon-btn" id="exportBtn" title="Export data">⇩</button><button class="avatar" id="avatarBtn">A</button></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
