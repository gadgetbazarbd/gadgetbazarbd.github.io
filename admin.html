<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Gadget Bazar BD — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=final4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="logo">GB</div>
    <h1>Gadget Bazar BD</h1>
    <p>Admin Control Center</p>
    <input id="loginEmail" type="email" placeholder="Admin email" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="login()">Sign in</button>
    <small>Use your Supabase Auth admin account.</small>
  </div>
</div>

<div id="app" class="app hidden">
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">GB</span>
      <div><b>Gadget Bazar</b><small>ADMIN PANEL</small></div>
    </div>

    <nav class="side-nav">
      <button class="nav active" data-section="dashboard">▦ <span>Dashboard</span></button>

      <button class="nav nav-parent" id="catalogToggle" onclick="toggleCatalog()">
        <span class="nav-left">▣ <span>Catalog</span></span>
        <span id="catalogArrow">⌄</span>
      </button>

      <div id="catalogMenu" class="subnav open">
        <button class="subnav-item active-sub" data-section="products">Products</button>
        <button class="subnav-item" data-section="categories">Categories</button>
      </div>

      <button class="nav" data-section="orders">▤ <span>Orders</span></button>
      <button class="nav" data-section="customers">♙ <span>Customers</span></button>
      <button class="nav" data-section="delivery">⌁ <span>Delivery</span></button>
      <button class="nav" data-section="payments">৳ <span>Payments</span></button>
      <button class="nav" data-section="settings">⚙ <span>Settings</span></button>
    </nav>

    <div class="side-bottom">
      <button onclick="exportData()">⇩ Export Data</button>
      <button onclick="importData()">⇧ Import Data</button>
      <button onclick="logout()">↪ Logout</button>
    </div>
  </aside>

  <main class="main">
    <header>
      <div class="header-left">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        <div><h2 id="pageTitle">Dashboard</h2><span id="pageSub">Store overview</span></div>
      </div>
      <div class="header-actions">
        <span class="live" id="connectionStatus">● Connected</span>
        <button class="header-add" onclick="addProduct()">＋ Add Product</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Edit</h3>
      <button onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="admin.js?v=final4"></script>
</body>
</html>
