<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gadget Bazar BD — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css?v=2"></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">GB</div><h1>Gadget Bazar BD</h1><p>Admin Control Center</p><input id="loginUser" placeholder="Admin username"><input id="loginPass" type="password" placeholder="Password"><button onclick="login()">Sign in</button><small>Demo login: admin / admin123</small></div></div>
